name: Deploy MkDocs site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      # 포지션·테마 페이지는 data/ 에서 매 빌드마다 새로 찍는다.
      # EC2 가 매일 상태와 이벤트 로그를 커밋·푸시하므로 그때마다 사이트가 갱신된다.
      # 순수 렌더링이라 네트워크도 API 키도 필요 없다.
      # nav 도 함께 갱신한다 — 러너 안에서만 바뀌고 커밋되지 않으므로,
      # 봇으로 종목을 추가해도 다음 빌드에서 자동으로 메뉴에 올라온다.
      - name: Generate position and theme pages
        run: python scripts/build_pages.py

      - name: Stage markdown into docs/
        run: |
          mkdir -p docs
          cp methodology.md methodology_v2.1_archive.md deepdive_index.md docs/
          cp -r mega-change-map watchlist calendar docs/
          cp -r pages docs/
          # 기존 홈은 아카이브 개요로 밀고, 사이트 첫 페이지는 현황판으로
          cp index.md docs/overview.md
          cp pages/index.md docs/index.md && rm docs/pages/index.md
          mkdir -p docs/assets && cp assets/*.css docs/assets/

      - name: Build site
        run: mkdocs build
        env:
          DISABLE_MKDOCS_2_WARNING: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
